[env:native_bitchat]
platform = native
lib_compat_mode = off
build_flags = 
  -std=gnu++17
  -I test/mocks
  -D FRAMEWORK_ARDUINO
  -D NATIVE_TEST
  -D ENABLE_BITCHAT=1
lib_deps =
  throwtheswitch/Unity
  rweather/Crypto @ ^0.4.0
test_build_src = yes
build_src_filter = 
  +<Mesh.cpp>
  +<Packet.cpp>
  +<Identity.cpp>
  +<Dispatcher.cpp>
  +<Utils.cpp>
  +<helpers/BaseChatMesh.cpp>
  +<helpers/TxtDataHelpers.cpp>
  +<helpers/AdvertDataHelpers.cpp>
  +<helpers/bitchat/*.cpp>
  -<helpers/bitchat/BitchatBridge.cpp>
  +<helpers/ble/*.cpp>
  +<../test/mocks/*.c>
